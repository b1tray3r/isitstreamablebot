version: "2"
sql:
  - engine: "sqlite"
    schema: "./sql/schemas"
    queries: "./sql/queries"
    gen:
        go:
          emit_prepared_queries: true
          emit_json_tags: true
          package: "pkg"
          out: "pkg/db"
          overrides:
            - db_type: "timestamptz"
              go_type:
                import: "time"
                type: "Time"